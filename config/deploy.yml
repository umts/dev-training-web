# <% def user_for(host) = Net::SSH::Config.for(host).fetch(:user, ENV.fetch('USER', nil)) %>

service: dev-training-web
image: umts/dev-training-web
registry:
  server: ghcr.io
  username: not_needed
  password:
    - KAMAL_REGISTRY_PASSWORD
builder:
  arch: amd64
  provenance: false
  sbom: false
labels:
  org.opencontainers.image.source: "https://github.com/umts/dev-training-web"
servers:
  web:
    - afs-umts-web4.admin.umass.edu
proxy:
  ssl: true
  host: umts-dt.admin.umass.edu
env:
  clear:
    TZ: America/New_York
  secret:
    - MASTER_KEY
ssh:
  user: <%= user_for 'afs-umts-web4.admin.umass.edu' %>
volumes:
  - "dev-training-web_log:/app/log"
