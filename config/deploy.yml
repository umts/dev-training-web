<%
  def user_for(host)
  Net::SSH::Config.for(host).fetch(:user, ENV.fetch('USER', nil))
  end
%>

service: dev-training-web
image: umts/dev-training-web
servers:
  web:
    - afs-umts-web4.admin.umass.edu
proxy:
  ssl: true
  host: umts-dt.admin.umass.edu
registry:
  server: localhost:5555
builder:
  arch: amd64
env:
  secret:
    - MASTER_KEY
ssh:
  user: <%= user_for 'afs-umts-web4.admin.umass.edu' %>
volumes:
  - "dev-training-web_log:/app/log"
